<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Caltech Karts</title>
<style>
* { box-sizing: border-box }
body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #14171b; color: #d8d8d3; font: 16px/1.5 system-ui, sans-serif }
main { width: min(1000px, calc(100% - 24px)) }
section { position: relative; aspect-ratio: 2; overflow: hidden }
iframe { position: absolute; inset: 0; width: 1000px; height: 500px; border: 0; transform-origin: top left }
p { margin: .7rem 0 }
</style>
<main>
<section><iframe src="./game.html" title="Caltech Karts game"></iframe></section>
<p>Arrow keys to drive · Space to use an item</p>
</main>
<script>
const frame = document.querySelector('iframe');
// Scale the finished image. SDL needs the original 1000 × 500 coordinate space.
new ResizeObserver(([entry]) => {
  frame.style.transform = 'scale(' + entry.contentRect.width / 1000 + ')';
}).observe(frame.parentElement);
</script>
</html>
